<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GluteRun">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>P — Train Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --surface3: #22223a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f8;
  --text2: #9090b0;
  --text3: #5a5a78;
  --violet: #7c5cfc;
  --violet-light: #a88bff;
  --violet-dim: rgba(124,92,252,0.15);
  --cyan: #00e5ff;
  --cyan-dim: rgba(0,229,255,0.1);
  --pink: #ff4fa3;
  --pink-dim: rgba(255,79,163,0.12);
  --green: #00f5a0;
  --green-dim: rgba(0,245,160,0.1);
  --amber: #ffb800;
  --amber-dim: rgba(255,184,0,0.1);
  --run-color: var(--cyan);
  --lift-color: var(--violet);
  --pilates-color: var(--green);
  --rest-color: var(--text3);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html { height: -webkit-fill-available; }

body {
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  padding: max(env(safe-area-inset-top),20px) 16px max(env(safe-area-inset-bottom),32px);
  overflow-x: hidden;
}

/* Ambient glow background */
body::before {
  content:'';
  position:fixed;
  top:-30%;
  left:-20%;
  width:60%;
  height:60%;
  background: radial-gradient(ellipse, rgba(124,92,252,0.12) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
body::after {
  content:'';
  position:fixed;
  bottom:-20%;
  right:-20%;
  width:50%;
  height:50%;
  background: radial-gradient(ellipse, rgba(0,229,255,0.08) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header {
  position: relative;
  z-index: 1;
  text-align: center;
  margin-bottom: 28px;
}

.program-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--violet-light);
  margin-bottom: 8px;
  opacity: 0.8;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(28px, 8vw, 44px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  background: linear-gradient(135deg, #fff 0%, var(--violet-light) 60%, var(--cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.week-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 18px;
}

.week-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  width: 40px; height: 40px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  transition: all 0.2s;
}
.week-btn:active { background: var(--violet); border-color: var(--violet); }

.week-pill {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 100px;
  padding: 8px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.week-num {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}
.week-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* Progress */
.progress-wrap {
  max-width: 340px;
  margin: 16px auto 0;
}
.progress-track {
  height: 3px;
  background: var(--surface3);
  border-radius: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--violet), var(--cyan));
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}
.progress-meta span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.1em;
}

/* ── STATS ROW ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 600px;
  margin: 0 auto 20px;
  position: relative;
  z-index: 1;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 10px;
  text-align: center;
}
.stat-num {
  font-family: 'Syne', sans-serif;
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(135deg, var(--violet-light), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-top: 3px;
}

/* ── DAY CARDS ── */
.days-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.day-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  transition: border-color 0.3s;
}
.day-card.completed { border-color: rgba(0,245,160,0.3); }

.day-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}

/* Color bar on left */
.day-accent {
  width: 3px;
  height: 40px;
  border-radius: 10px;
  flex-shrink: 0;
}

.day-dot {
  width: 42px; height: 42px;
  border-radius: 12px;
  display: flex; align-items:center; justify-content:center;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
  letter-spacing: 0.05em;
}

.day-info { flex: 1; min-width: 0; }

.day-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--text3);
  line-height: 1;
}
.day-title {
  font-family: 'Syne', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.day-tags {
  display: flex;
  gap: 5px;
  margin-top: 5px;
  flex-wrap: wrap;
}
.tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 100px;
  font-weight: 500;
}
.tag-run { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(0,229,255,0.2); }
.tag-lift { background: var(--violet-dim); color: var(--violet-light); border: 1px solid rgba(124,92,252,0.25); }
.tag-pilates { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.tag-rest { background: rgba(255,255,255,0.04); color: var(--text3); border: 1px solid var(--border); }

.check-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1.5px solid var(--border2);
  background: transparent;
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 14px;
  flex-shrink: 0;
  transition: all 0.2s;
  color: var(--text3);
}
.check-btn.done { background: var(--green-dim); border-color: var(--green); color: var(--green); }

.chevron {
  font-size: 11px;
  color: var(--text3);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  flex-shrink: 0;
}
.chevron.open { transform: rotate(180deg); }

/* ── DAY BODY ── */
.day-body {
  display: none;
  padding: 0 16px 18px;
  border-top: 1px solid var(--border);
}
.day-body.open { display: block; }

.section-hd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text3);
  margin: 16px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-hd::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── RUN BLOCK ── */
.run-block {
  background: var(--cyan-dim);
  border: 1px solid rgba(0,229,255,0.15);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.run-block.threshold { background: rgba(255,184,0,0.06); border-color: rgba(255,184,0,0.2); }
.run-block.interval { background: rgba(255,79,163,0.06); border-color: rgba(255,79,163,0.2); }

.run-target-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.run-target-badge {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--cyan);
  line-height: 1;
}
.run-target-badge.threshold { color: var(--amber); }
.run-target-badge.interval { color: var(--pink); }

.run-target-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 1.4;
}

.run-tip {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 10px;
}
.run-tip strong { color: var(--text); }

/* Run log inputs */
.run-log-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}
.run-log-item label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  display: block;
  margin-bottom: 4px;
}
.run-log-item input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.run-log-item input:focus { border-color: var(--cyan); }
.run-log-item input::placeholder { color: var(--text3); }

/* ── EXERCISE LIST ── */
.exercise-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

.exercise-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.exercise-header {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  gap: 10px;
  cursor: pointer;
}
.exercise-header:active { background: var(--surface3); }

.ex-check {
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--border2);
  background: transparent;
  flex-shrink: 0;
  display: flex; align-items:center; justify-content:center;
  font-size: 11px;
  color: var(--green);
  transition: all 0.15s;
}
.exercise-item.ex-done .ex-check { background: var(--green-dim); border-color: var(--green); }

.ex-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  flex: 1;
}
.exercise-item.ex-done .ex-name { color: var(--text3); text-decoration: line-through; }

.ex-target {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--violet-light);
  white-space: nowrap;
}

/* Sets tracker */
.sets-tracker {
  display: none;
  padding: 0 12px 12px;
  border-top: 1px solid var(--border);
}
.sets-tracker.open { display: block; }

.sets-header {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 1fr 32px;
  gap: 6px;
  padding: 8px 0 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
}

.set-row {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 1fr 32px;
  gap: 6px;
  margin-bottom: 6px;
  align-items: center;
}
.set-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  text-align: center;
}
.set-input {
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 6px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
  outline: none;
  text-align: center;
  -webkit-appearance: none;
  transition: border-color 0.2s;
  width: 100%;
}
.set-input:focus { border-color: var(--violet); }
.set-input::placeholder { color: var(--text3); font-size: 11px; }

.set-done-btn {
  width: 28px; height: 28px;
  border-radius: 7px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  transition: all 0.15s;
}
.set-done-btn.done { background: var(--green-dim); border-color: var(--green); color: var(--green); }

/* Notes */
.notes-wrap { margin-top: 14px; }
.notes-wrap textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: var(--text);
  resize: none;
  min-height: 64px;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
  line-height: 1.5;
}
.notes-wrap textarea:focus { border-color: var(--violet); }
.notes-wrap textarea::placeholder { color: var(--text3); font-size: 12px; }

/* Day accent colours */
.accent-run { background: var(--cyan); }
.accent-lift { background: var(--violet); }
.accent-dual { background: linear-gradient(180deg, var(--pink) 0%, var(--violet) 100%); }
.accent-pilates { background: var(--green); }
.accent-rest { background: var(--text3); }

.dot-run { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(0,229,255,0.2); }
.dot-lift { background: var(--violet-dim); color: var(--violet-light); border: 1px solid rgba(124,92,252,0.25); }
.dot-dual { background: var(--pink-dim); color: var(--pink); border: 1px solid rgba(255,79,163,0.2); }
.dot-pilates { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,245,160,0.2); }
.dot-rest { background: rgba(255,255,255,0.04); color: var(--text3); border: 1px solid var(--border); }

/* Install banner */
#installBanner {
  display: none;
  background: linear-gradient(135deg, var(--violet), #5a3fd4);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 16px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  position: relative;
  z-index: 1;
}
#installBanner p { font-size: 13px; line-height: 1.5; margin-bottom: 8px; color: rgba(255,255,255,0.9); }
#installBanner strong { color: white; }
#installBanner .ib-btns { display: flex; gap: 8px; }
#installBanner button {
  background: rgba(255,255,255,0.15);
  color: white;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 100px;
  padding: 7px 16px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
#installBanner .ib-dismiss { background: transparent; border-color: transparent; opacity: 0.6; }

/* Toast */
#toast {
  display: none;
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 100px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.1em;
  z-index: 1000;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="installBanner">
  <p><strong>📱 Add to Home Screen</strong><br>Tap <strong>Share</strong> → <strong>"Add to Home Screen"</strong> to use as an app</p>
  <div class="ib-btns">
    <button onclick="document.getElementById('installBanner').style.display='none'">Got it</button>
    <button class="ib-dismiss" onclick="dismissBanner()">Not now</button>
  </div>
</div>

<header>
  <div class="program-label">10K + Glute Program · 8 Weeks</div>
  <h1>Train with P</h1>
  <div class="week-nav">
    <button class="week-btn" onclick="changeWeek(-1)">←</button>
    <div class="week-pill">
      <div class="week-num" id="weekNum">1</div>
      <div class="week-sub">of 8 weeks</div>
    </div>
    <button class="week-btn" onclick="changeWeek(1)">→</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:12.5%"></div></div>
    <div class="progress-meta">
      <span id="progressLeft">Week 1</span>
      <span id="progressRight">12.5% complete</span>
    </div>
  </div>
</header>

<div class="stats-row">
  <div class="stat-card"><div class="stat-num" id="sDays">0</div><div class="stat-label">Days Done</div></div>
  <div class="stat-card"><div class="stat-num" id="sExs">0</div><div class="stat-label">Sets Logged</div></div>
  <div class="stat-card"><div class="stat-num" id="sRuns">0</div><div class="stat-label">Runs Done</div></div>
</div>

<div class="days-grid" id="daysGrid"></div>
<div id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────
const DAYS = [
  {
    id:'mon', day:'Monday', title:'Threshold Run',

        'Your current 7:30/km pace → aim to finish these runs at 7:10–7:20/km by week 4.',

        'Track average pace each week. Even 5 sec/km improvement is a win.',

  {
    id:'tue', day:'Tuesday', title:'Leg Day A',

      {name:'Hip Thrust', target:'4 × 6–8', sets:4},

      {name:'Back Extensions', target:'3 × 12–15', sets:3},
      {name:'Hip Abduction Machine', target:'3 × 15–20', sets:3},
    ]
  },
  {
    id:'wed', day:'Wednesday', title:'Intervals + Push',
    accentClass:'accent-dual', dotClass:'dot-dual', dotLabel:'WED',
    tags:[{l:'Intervals',c:'tag-run'},{l:'Push',c:'tag-lift'}],
    isRun:true, runType:'interval', isDual:true, isRest:false,
    runConfig:{
      badge:['6×400m','6×400m','8×400m','8×400m','4×800m','4×800m','3×1K','Easy run 🎉'],
      badgeLabel:'Interval Target',
      tip:'<strong>Rest 90 sec</strong> between reps. Warm up 5 min easy, cool down 5 min easy.',
      tips:[
        'Run intervals at an effort where you couldn\'t hold a conversation at all.',
        'Wk 1–2: 400m in ~3:30 (your current 5K pace). Wk 5+: push to ~3:15.',
        'Intervals are how you drop your pace. Don\'t skip these.',
        'If you only have time for one workout — do this one.',
      ]
    },
    exercises:[
      {name:'Bench Press', target:'4 × 6–8', sets:4},
      {name:'Seated Shoulder Press', target:'3 × 8–10', sets:3},
      {name:'Lateral Raises', target:'3 × 12–15', sets:3},
      {name:'Chest Press Machine', target:'3 × 10–12', sets:3},
      {name:'Overhead Tricep Extension', target:'3 × 10–12', sets:3},
      {name:'Rope Pushdowns', target:'3 × 12–15', sets:3},
    ]
  },
  {
    id:'thu', day:'Thursday', title:'Pilates',
    accentClass:'accent-pilates', dotClass:'dot-pilates', dotLabel:'THU',
    tags:[{l:'Pilates',c:'tag-pilates'},{l:'Core',c:'tag-pilates'}],
    isRun:false, isRest:false,
    exercises:[
      {name:'Full Pilates session', target:'45–60 min', sets:1},
      {name:'Core + glute activation', target:'Focus', sets:1},
      {name:'Hip flexor & hamstring stretch', target:'10 min', sets:1},
    ]
  },
  {
    id:'fri', day:'Friday', title:'Pull Day',
    accentClass:'accent-lift', dotClass:'dot-lift', dotLabel:'FRI',
    tags:[{l:'Pull',c:'tag-lift'},{l:'Back & Biceps',c:'tag-lift'}],
    isRun:false, isRest:false,
    exercises:[
      {name:'Pull-Ups / Assisted Pull-Ups', target:'3 × 6–10', sets:3},
      {name:'Barbell Rows', target:'4 × 8–10', sets:4},
      {name:'Lat Pulldown', target:'3 × 10–12', sets:3},
      {name:'Hammer Curls', target:'3 × 10–12', sets:3},
      {name:'EZ Bar Curls', target:'3 × 10–12', sets:3},
      {name:'Cable Rear Delt Fly', target:'3 × 12–15', sets:3},
    ]
  },
  {
    id:'sat', day:'Saturday', title:'Leg Day B',
    accentClass:'accent-lift', dotClass:'dot-lift', dotLabel:'SAT',
    tags:[{l:'Hypertrophy',c:'tag-lift'},{l:'Glutes',c:'tag-lift'}],
    isRun:false, isRest:false,
    exercises:[
      {name:'Smith Squat / Leg Press', target:'4 × 8–10', sets:4},
      {name:'Bulgarian Split Squat', target:'3 × 8 each leg', sets:3},
      {name:'KAS Glute Bridge', target:'4 × 12–15', sets:4},
      {name:'Adductor Machine', target:'3 × 12–15', sets:3},
      {name:'Cable Kickbacks', target:'3 × 15–20', sets:3},
      {name:'Seated Leg Curl', target:'3 × 12–15', sets:3},
    ]
  },
  {
    id:'sun', day:'Sunday', title:'Rest & Recovery',
    accentClass:'accent-rest', dotClass:'dot-rest', dotLabel:'SUN',
    tags:[{l:'Rest',c:'tag-rest'}],
    isRun:false, isRest:true,
    exercises:[
      {name:'8–10K steps (walking)', target:'Daily', sets:1},
      {name:'Stretching / mobility', target:'10–15 min', sets:1},
      {name:'Hydration & nutrition', target:'Focus', sets:1},
    ]
  },
];

// ── STATE ─────────────────────────────────────────────
let week = 1;
let S = {};

function gs(w, id) {
  if (!S[w]) S[w] = {};
  if (!S[w][id]) S[w][id] = { done:false, exDone:{}, sets:{}, notes:'', runLog:{dist:'',time:'',pace:''} };
  return S[w][id];
}

function save() {
  try { localStorage.setItem('trainWithP_v1', JSON.stringify({S, week})); } catch(e) {}
}

function load() {
  try {
    const d = localStorage.getItem('trainWithP_v1');
    if (d) { const p = JSON.parse(d); S = p.S||{}; week = p.week||1; }
  } catch(e) {}
}

// ── RENDER ────────────────────────────────────────────
function render() {
  document.getElementById('weekNum').textContent = week;
  document.getElementById('progressFill').style.width = `${(week/8)*100}%`;
  document.getElementById('progressLeft').textContent = `Week ${week}`;
  document.getElementById('progressRight').textContent = `${Math.round((week/8)*100)}% complete`;

  // preserve open state
  const openMap = {};
  const openEx = {};
  DAYS.forEach(d => {
    const b = document.getElementById(`body-${d.id}`);
    if (b) openMap[d.id] = b.classList.contains('open');
    d.exercises && d.exercises.forEach((_, i) => {
      const st = document.getElementById(`sets-${d.id}-${i}`);
      if (st) openEx[`${d.id}-${i}`] = st.classList.contains('open');
    });
  });

  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  DAYS.forEach(d => renderDay(d, grid, openMap, openEx));
  updateStats();
}

function renderDay(d, grid, openMap, openEx) {
  const s = gs(week, d.id);
  const card = document.createElement('div');
  card.className = `day-card${s.done?' completed':''}`;

  // Header
  const tagsHTML = d.tags.map(t=>`<span class="tag ${t.c}">${t.l}</span>`).join('');
  const wasOpen = openMap[d.id];

  card.innerHTML = `
    <div class="day-header" onclick="toggleBody('${d.id}')">
      <div class="day-accent ${d.accentClass}"></div>
      <div class="day-dot ${d.dotClass}">${d.dotLabel}</div>
      <div class="day-info">
        <div class="day-name">${d.day}</div>
        <div class="day-title">${d.title}</div>
        <div class="day-tags">${tagsHTML}</div>
      </div>
      <button class="check-btn${s.done?' done':''}" onclick="event.stopPropagation();toggleDay('${d.id}')">${s.done?'✓':''}</button>
      <span class="chevron${wasOpen?' open':''}" id="chev-${d.id}">▾</span>
    </div>
    <div class="day-body${wasOpen?' open':''}" id="body-${d.id}">
      ${buildBody(d, s, openEx)}
    </div>`;

  grid.appendChild(card);
  // Re-attach input listeners
  attachInputs(d, s);
}

function buildBody(d, s, openEx) {
  let html = '';

  // Run block
  if (d.isRun && d.runConfig) {
    const rc = d.runConfig;
    const badge = rc.badge[week-1];
    const tipIdx = (week-1) % rc.tips.length;
    const typeClass = d.runType;
    const badgeColorClass = d.runType;

    html += `<div class="section-hd">🏃‍♀️ Run</div>
    <div class="run-block ${typeClass}">
      <div class="run-target-row">
        <div class="run-target-badge ${badgeColorClass}">${badge}</div>
        <div class="run-target-label">${rc.badgeLabel}<br><span style="color:var(--text2);font-size:11px">Week ${week}</span></div>
      </div>
      <div class="run-tip">${rc.tip}</div>
      <div class="run-tip" style="background:var(--surface2);border-radius:8px;padding:8px 10px;border-left:2px solid ${d.runType==='interval'?'var(--pink)':d.runType==='threshold'?'var(--amber)':'var(--cyan)'}">
        💡 ${rc.tips[tipIdx]}
      </div>
      <div class="section-hd" style="margin-top:12px">Log this run</div>
      <div class="run-log-grid">
        <div class="run-log-item">
          <label>Distance</label>
          <input type="text" inputmode="decimal" id="rlog-dist-${d.id}" placeholder="km" value="${s.runLog?.dist||''}">
        </div>
        <div class="run-log-item">
          <label>Time</label>
          <input type="text" id="rlog-time-${d.id}" placeholder="mm:ss" value="${s.runLog?.time||''}">
        </div>
        <div class="run-log-item">
          <label>Avg Pace</label>
          <input type="text" id="rlog-pace-${d.id}" placeholder="/km" value="${s.runLog?.pace||''}">
        </div>
      </div>
    </div>`;
  }

  // Exercises
  if (d.exercises && d.exercises.length) {
    const label = d.isDual ? '💪 Push Day Lifts' : d.isRest ? 'Recovery' : d.id==='fri' ? '💪 Pull Day' : d.id==='thu' ? '🧘‍♀️ Session' : '💪 Exercises';
    html += `<div class="section-hd">${label}</div><ul class="exercise-list">`;
    d.exercises.forEach((ex, i) => {
      const done = s.exDone[i];
      const wasExOpen = openEx && openEx[`${d.id}-${i}`];
      const sets = ex.sets || 3;
      let setsHTML = `<div class="sets-tracker${wasExOpen?' open':''}" id="sets-${d.id}-${i}">
        <div class="sets-header"><span>Set</span><span>Reps</span><span>Weight</span><span>Notes</span><span>✓</span></div>`;
      for (let si=0; si<sets; si++) {
        const sv = s.sets[`${i}-${si}`] || {};
        setsHTML += `<div class="set-row">
          <div class="set-num">${si+1}</div>
          <input class="set-input" type="text" inputmode="numeric" id="si-r-${d.id}-${i}-${si}" placeholder="—" value="${sv.reps||''}">
          <input class="set-input" type="text" inputmode="decimal" id="si-w-${d.id}-${i}-${si}" placeholder="kg" value="${sv.weight||''}">
          <input class="set-input" type="text" id="si-n-${d.id}-${i}-${si}" placeholder="—" value="${sv.note||''}">
          <button class="set-done-btn${sv.done?' done':''}" id="sdb-${d.id}-${i}-${si}" onclick="toggleSetDone('${d.id}',${i},${si})">${sv.done?'✓':''}</button>
        </div>`;
      }
      setsHTML += '</div>';

      html += `<li class="exercise-item${done?' ex-done':''}" id="ex-${d.id}-${i}">
        <div class="exercise-header" onclick="toggleExBody('${d.id}',${i})">
          <div class="ex-check" id="exc-${d.id}-${i}">${done?'✓':''}</div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-target">${ex.target}</div>
        </div>
        ${setsHTML}
      </li>`;
    });
    html += '</ul>';
  }

  // Notes
  html += `<div class="notes-wrap">
    <div class="section-hd">📝 Notes</div>
    <textarea id="notes-${d.id}" placeholder="How'd it feel? PRs, energy, anything…">${s.notes||''}</textarea>
  </div>`;

  return html;
}

function attachInputs(d, s) {
  // Run log
  if (d.isRun) {
    ['dist','time','pace'].forEach(k => {
      const el = document.getElementById(`rlog-${k}-${d.id}`);
      if (el) el.addEventListener('input', e => {
        if (!s.runLog) s.runLog = {};
        s.runLog[k] = e.target.value;
        save();
      });
    });
  }
  // Set inputs
  d.exercises && d.exercises.forEach((ex, i) => {
    for (let si=0; si<(ex.sets||3); si++) {
      ['r','w','n'].forEach(k => {
        const el = document.getElementById(`si-${k}-${d.id}-${i}-${si}`);
        if (el) el.addEventListener('input', e => {
          if (!s.sets[`${i}-${si}`]) s.sets[`${i}-${si}`] = {};
          const map = {r:'reps',w:'weight',n:'note'};
          s.sets[`${i}-${si}`][map[k]] = e.target.value;
          save();
        });
      });
    }
  });
  // Notes
  const notesEl = document.getElementById(`notes-${d.id}`);
  if (notesEl) notesEl.addEventListener('input', e => { s.notes = e.target.value; save(); });
}

// ── INTERACTIONS ─────────────────────────────────────
function toggleBody(id) {
  const b = document.getElementById(`body-${id}`);
  const c = document.getElementById(`chev-${id}`);
  b.classList.toggle('open');
  c.classList.toggle('open');
}

function toggleDay(id) {
  const s = gs(week, id);
  s.done = !s.done;
  save();
  render();
  if (s.done) showToast('Day complete 🔥');
}

function toggleExBody(dayId, exIdx) {
  const st = document.getElementById(`sets-${dayId}-${exIdx}`);
  if (st) st.classList.toggle('open');
}

function toggleSetDone(dayId, exIdx, setIdx) {
  const s = gs(week, dayId);
  if (!s.sets[`${exIdx}-${setIdx}`]) s.sets[`${exIdx}-${setIdx}`] = {};
  const sv = s.sets[`${exIdx}-${setIdx}`];
  sv.done = !sv.done;

  const btn = document.getElementById(`sdb-${dayId}-${exIdx}-${setIdx}`);
  if (btn) { btn.classList.toggle('done', sv.done); btn.textContent = sv.done?'✓':''; }

  // Check if all sets done → mark exercise done
  const day = DAYS.find(d=>d.id===dayId);
  if (day) {
    const ex = day.exercises[exIdx];
    const allDone = Array.from({length:ex.sets||3},(_,si)=>s.sets[`${exIdx}-${si}`]?.done).every(Boolean);
    s.exDone[exIdx] = allDone;
    const exEl = document.getElementById(`ex-${dayId}-${exIdx}`);
    const exChk = document.getElementById(`exc-${dayId}-${exIdx}`);
    if (exEl) exEl.classList.toggle('ex-done', allDone);
    if (exChk) { exChk.textContent = allDone?'✓':''; }
  }
  save();
  updateStats();
}

function updateStats() {
  let days=0, sets=0, runs=0;
  DAYS.forEach(d => {
    const s = gs(week, d.id);
    if (s.done) { days++; if(d.isRun) runs++; }
    Object.values(s.sets).forEach(sv => { if(sv.done) sets++; });
  });
  document.getElementById('sDays').textContent = days;
  document.getElementById('sExs').textContent = sets;
  document.getElementById('sRuns').textContent = runs;
}

function changeWeek(dir) {
  week = Math.max(1, Math.min(8, week + dir));
  save();
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 2000);
}

function dismissBanner() {
  try { localStorage.setItem('pwa_dismissed','1'); } catch(e) {}
  document.getElementById('installBanner').style.display='none';
}

function checkInstall() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.navigator.standalone===true;
  const dismissed = localStorage.getItem('pwa_dismissed');
  if (isIOS && !standalone && !dismissed) {
    document.getElementById('installBanner').style.display='block';
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

window.addEventListener('offline', ()=>showToast('📵 Offline — saves locally'));

load();
checkInstall();
render();
</script>
</body>
</html>
